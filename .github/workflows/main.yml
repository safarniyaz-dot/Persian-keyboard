name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q persian-voice-keyboard.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download Persian offline model
        working-directory: persian-voice-keyboard
        run: bash scripts/download_model.sh

      - name: Build debug APK
        working-directory: persian-voice-keyboard
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: persian-voice-keyboard-debug
          path: persian-voice-keyboard/app/build/outputs/apk/debug/*.apk
